<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Color scheme for browser native elements (scrollbars, inputs, etc.) -->
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <link rel="manifest" href="/images/favicon/site.webmanifest" />

    <!-- SEO Meta Tags -->
    <title>LifeOS — 本地优先的个人管理平台</title>
    <meta name="description" content="LifeOS 是一个本地优先的个人综合管理平台：日程、任务、项目、笔记、收藏与 AI 助手聚合在一个工作台里。所有数据保存在你自己的设备上，无需账户，无需服务器。" />
    <meta name="keywords" content="lifeos, productivity, dashboard, personal workspace, local-first, privacy-first, task management, calendar, kanban, notes, bookmarks, ai assistant, pwa, offline" />
    <meta name="author" content="LifeOS Contributors" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LifeOS — 本地优先的个人管理平台" />
    <meta property="og:description" content="A local-first personal dashboard and management workspace. All data stays on your device." />
    <meta property="og:image" content="/images/og-image.png" />
    <meta property="og:image:alt" content="LifeOS logo — a local-first personal dashboard and management workspace" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="LifeOS" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LifeOS — 本地优先的个人管理平台" />
    <meta name="twitter:description" content="A local-first personal dashboard and management workspace. All data stays on your device." />
    <meta name="twitter:image" content="/images/og-image.png" />
    <meta name="twitter:image:alt" content="LifeOS logo — a local-first personal dashboard and management workspace" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LifeOS",
      "url": "https://github.com/herfavor/lifeos",
      "description": "A local-first personal dashboard and management workspace. All data stays on your device.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Any (Web Browser)",
      "browserRequirements": "Requires JavaScript. Works best in Chrome, Firefox, Safari, Edge.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "LifeOS Contributors",
        "url": "https://github.com/herfavor/lifeos"
      },
      "image": "/images/og-image.png",
      "featureList": "Dashboard, Today, Inbox, Projects, Tasks, Calendar, Notes, Bookmarks, AI Assistant, Review, Time Tracking, Habits",
      "license": "https://opensource.org/licenses/MIT"
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS (for map widget) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Leaflet JS (for map widget) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>

    <!-- LifeOS is local-first: no analytics beacons, no telemetry. -->
  </body>
</html>
