name: Repository maintenance

on:
  push:
    branches:
      - chore/repository-hygiene-baseline
    paths:
      - .github/workflows/repository-maintenance.yml

permissions:
  contents: write

jobs:
  refresh-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hygiene branch
        uses: actions/checkout@v6
        with:
          ref: chore/repository-hygiene-baseline

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Classify development-only dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const devOnly = [
            '@playwright/test',
            '@types/crypto-js',
            '@types/d3',
            '@types/katex',
          ];
          pkg.devDependencies ??= {};
          for (const name of devOnly) {
            if (pkg.dependencies?.[name]) {
              pkg.devDependencies[name] = pkg.dependencies[name];
              delete pkg.dependencies[name];
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Report production audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Commit generated dependency metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh dependency metadata"
          git push origin HEAD:chore/repository-hygiene-baseline
